# Gives Ollama the server's NVIDIA GPU. Production turns this on with COMPOSE_FILE in .env;
# machines without an NVIDIA GPU just run docker-compose.yml.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  backend:
    environment:
      # 20 of 33 layers fill the MX150's 2 GB; 22 runs out of memory
      - Ollama__NumGpu=20
