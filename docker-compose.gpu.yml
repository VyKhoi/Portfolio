# Gives Ollama the server's NVIDIA GPU. Production turns this on with COMPOSE_FILE in .env;
# machines without an NVIDIA GPU just run docker-compose.yml.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  backend:
    environment:
      # Highest layer count that fits the MX150's 2 GB with qwen3:4b-instruct (measured 2026-11-08)
      - Ollama__NumGpu=22
