# Rate limiting zones (placed in http context)
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=3r/m;
limit_req_status 429;

server {
    listen 80;

    # Global payload cap (prevents large body DoS)
    client_max_body_size 1M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AI Endpoints with rate limiting and unbuffered SSE streaming
    location /api/ai/ {
        limit_req zone=ai_limit burst=4 nodelay;

        proxy_pass http://backend:8080/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strictly disable buffering for instant SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    # Contact form endpoint with strict anti-spam rate limiting
    location = /api/contact/messages {
        limit_req zone=contact_limit burst=2 nodelay;

        proxy_pass http://backend:8080/api/contact/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General backend API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static React Single Page Application (SPA)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

