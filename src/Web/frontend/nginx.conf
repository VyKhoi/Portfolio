# Rate limiting zones (placed in http context)
# Only count POST requests against rate-limit zones so Admin GET/PATCH/DELETE calls are never 429-throttled
map $request_method $post_binary_remote_addr {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $post_binary_remote_addr zone=ai_limit:10m rate=20r/m;
limit_req_zone $post_binary_remote_addr zone=contact_limit:10m rate=5r/m;
limit_req_zone $post_binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;

    # Global payload cap (prevents large body DoS)
    client_max_body_size 1M;

    # Real visitor IP: the gateway nginx reaches this container over a Docker network and already
    # resolved the Cloudflare client IP into X-Real-IP. Rate limits below then apply per visitor.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Real-IP;

    # Gzip Compression for maximum speed & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss image/svg+xml;
    gzip_min_length 256;

    # Redirects stay on the public host instead of this container's port
    absolute_redirect off;

    root /usr/share/nginx/html;
    error_page 404 /404.html;

    include /etc/nginx/site-headers.conf;

    # AI Endpoints with POST rate limiting and unbuffered SSE streaming
    location /api/ai/ {
        limit_req zone=ai_limit burst=6 nodelay;

        proxy_pass http://backend:8080/api/ai/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strictly disable buffering for instant SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    # Contact form endpoint with strict POST anti-spam rate limiting
    location = /api/contact/messages {
        limit_req zone=contact_limit burst=3 nodelay;

        proxy_pass http://backend:8080/api/contact/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login endpoint with anti-bruteforce rate limiting
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend:8080/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General backend API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO verification and crawl files
    location ~ ^/(robots\.txt|sitemap\.xml|googled11c245fd77c188a\.html|site\.webmanifest)$ {
        access_log off;
        log_not_found off;
    }

    # Vite hashed bundles (filename changes on every build) -> safe to cache forever.
    # ^~ makes this prefix win over the regex location below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/site-headers.conf;
        access_log off;
    }

    # Non-hashed public files (favicons, logo, avatar, CV...) keep the same URL when updated,
    # so cache briefly and revalidate instead of pinning them for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        include /etc/nginx/site-headers.conf;
        access_log off;
    }

    # Prerendered public pages. Browsers always revalidate; s-maxage lets a Cloudflare cache rule
    # keep the HTML at the edge for two minutes so most visits never reach this server.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=120, must-revalidate" always;
        include /etc/nginx/site-headers.conf;
    }

    location = /vi {
        try_files /vi/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=120, must-revalidate" always;
        include /etc/nginx/site-headers.conf;
    }

    location = /vi/ {
        return 301 /vi;
    }

    location ~ ^/(vi/)?privacy$ {
        try_files /$1privacy/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=120, must-revalidate" always;
        include /etc/nginx/site-headers.conf;
    }

    location ~ ^/(vi/)?privacy/$ {
        return 301 /$1privacy;
    }

    # Project pages (slugs from src/content/projects.ts); unknown slugs stay a real 404
    location ~ ^/(vi/)?projects/(chickennote|dangvykhoi-com)$ {
        try_files /$1projects/$2/index.html =404;
        add_header Cache-Control "public, max-age=0, s-maxage=120, must-revalidate" always;
        include /etc/nginx/site-headers.conf;
    }

    location ~ ^/(vi/)?projects/(chickennote|dangvykhoi-com)/$ {
        return 301 /$1projects/$2;
    }

    # English moved to the root; keep old links and search results working
    location ~ ^/en/?$ {
        return 301 /;
    }

    # Login and admin run from the empty app shell and stay out of search engines
    location ~ ^/(login|dashboard)(/|$) {
        try_files /app.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/site-headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/site-headers.conf;
    }

    # Anything else is a real file or a real 404
    location / {
        try_files $uri =404;
    }
}
