<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=2" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="theme-color" content="#050505" />
    <!--head:start-->
    <title>Đặng Vỹ Khôi</title>
    <meta name="description" content="" />
    <!--head:end-->

    <!-- Critical inline CSS: branded boot splash while the React bundle loads -->
    <style>
      html, body { margin: 0; background: #050505; color: #fff; }
      /* Opaque overlay (same color as the site) that fades out once React + fonts are ready */
      .boot-splash {
        position: fixed; inset: 0; z-index: 9999; display: flex;
        align-items: center; justify-content: center; background: #050505;
        transition: opacity .5s ease, visibility .5s ease;
      }
      .boot-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      /* Logo only fades in if loading takes > 250ms, so fast/cached visits never see a flash */
      .boot-inner {
        display: flex; flex-direction: column; align-items: center; gap: 22px;
        opacity: 0; animation: boot-in .4s ease .25s forwards;
      }
      .boot-splash img {
        width: 72px; height: 72px; object-fit: contain;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-splash .boot-bar {
        position: relative; width: 120px; height: 2px; overflow: hidden;
        background: #1f1f22; border-radius: 2px;
      }
      .boot-splash .boot-bar::after {
        content: ""; position: absolute; inset: 0; width: 40%;
        background: #FF5C00; border-radius: 2px;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @keyframes boot-in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash img, .boot-splash .boot-bar::after { animation: none; }
        .boot-inner { animation: none; opacity: 1; }
        .boot-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"><!--app:start-->
      <!-- Only the login and admin shell keep this splash; public pages are prerendered -->
      <div id="boot-splash" class="boot-splash" aria-hidden="true">
        <div class="boot-inner">
          <img src="/favicon-96x96.png?v=2" alt="" width="72" height="72" fetchpriority="high" />
          <div class="boot-bar"></div>
        </div>
      </div>
    <!--app:end--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
