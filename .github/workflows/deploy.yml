name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          MAIL_APP_PASSWORD=${{ secrets.MAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF

      - name: Ensure Docker volume for Ollama
        run: |
          docker volume create ollama_models || true

      - name: Build and Deploy via Docker Compose
        run: |
          echo "Dọn dẹp container cũ..."
          docker compose down --remove-orphans || true
          echo "Build bản mới tinh 100% không dùng cache cũ..."
          docker compose build --no-cache
          echo "Khởi động container mới..."
          docker compose up -d --force-recreate --remove-orphans
          echo "Xóa các image build cũ (<none>)..."
          docker image prune -f

      - name: Initialize or Update AI Model (sigma-cat)
        run: |
          sleep 5
          docker exec -i portfolio_ollama ollama pull qwen2.5:1.5b
          docker exec -i portfolio_ollama ollama create sigma-cat -f /ai/Modelfile
