name: Deploy Portfolio

# Runs on the self-hosted runner at home. Keep this push-only: never add pull_request triggers
# to this public repo, or forks could run code on the server.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Prepare server-managed secrets
        run: |
          # Postgres password and JWT secret are generated on the server (~/.config/portfolio) and
          # never stored in GitHub. Delete a file there and redeploy to rotate it.
          bash scripts/server-secrets.sh ensure
          echo "::add-mask::$(cat "$HOME/.config/portfolio/postgres_password")"
          echo "::add-mask::$(cat "$HOME/.config/portfolio/jwt_secret")"

      - name: Create .env file
        run: |
          (
            umask 077
            {
              echo "POSTGRES_PASSWORD=$(cat "$HOME/.config/portfolio/postgres_password")"
              echo "JWT_SECRET_KEY=$(cat "$HOME/.config/portfolio/jwt_secret")"
              echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
              echo "MAIL_APP_PASSWORD=${{ secrets.MAIL_APP_PASSWORD }}"
              echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}"
              echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"
              # Ollama gets at most half of the server's cores so the other sites stay responsive
              echo "OLLAMA_CPUS=$(( $(nproc) / 2 > 0 ? $(nproc) / 2 : 1 ))"
            } > .env
          )

      - name: Ensure Docker volume for Ollama
        run: |
          docker volume create ollama_models || true

      - name: Backup database before deploy
        run: |
          BACKUP_DIR="$HOME/backups/portfolio"
          mkdir -p "$BACKUP_DIR"
          if docker ps --format '{{.Names}}' | grep -qx portfolio_postgres; then
            FILE="$BACKUP_DIR/portfolio_db_$(date +%Y%m%d_%H%M%S).dump"
            docker exec portfolio_postgres pg_dump -U postgres -Fc portfolio_db > "$FILE"
            test -s "$FILE" || { echo "Backup is empty, aborting deploy"; exit 1; }
            echo "Backup saved: $FILE ($(du -h "$FILE" | cut -f1))"
            # Keep the 14 most recent backups
            ls -1t "$BACKUP_DIR"/portfolio_db_*.dump | tail -n +15 | xargs -r rm -f
          else
            echo "Postgres container is not running yet, skipping backup"
          fi

      - name: Build images
        run: |
          docker compose build

      - name: Start database and sync its password
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' portfolio_postgres 2>/dev/null)" = healthy ] && break
            sleep 2
          done
          bash scripts/server-secrets.sh sync-db

      - name: Deploy containers
        run: |
          # pgAdmin only runs on demand (profile "tools"); make sure no always-on container is left
          docker rm -f portfolio_pgadmin 2>/dev/null || true
          docker compose up -d --remove-orphans

      - name: Initialize or Update AI Model (sigma-cat)
        run: |
          for i in $(seq 1 30); do docker exec portfolio_ollama ollama list >/dev/null 2>&1 && break; sleep 2; done
          docker exec -i portfolio_ollama ollama pull qwen2.5:1.5b
          docker exec -i portfolio_ollama ollama create sigma-cat -f /ai/Modelfile
          docker exec -i portfolio_ollama ollama rm qwen2.5:3b || true

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:18122/ && curl -fsS -o /dev/null http://localhost:18122/api/content/profile; then
              echo "Portfolio is healthy"; exit 0
            fi
            sleep 3
          done
          echo "Health check failed"; docker compose ps; docker compose logs --tail 80 backend frontend; exit 1

      - name: Report image versions
        if: always()
        run: |
          docker exec portfolio_ollama ollama --version 2>/dev/null || true
          docker image inspect dpage/pgadmin4:9 --format 'pgadmin4 {{index .Config.Labels "org.opencontainers.image.version"}} {{.Id}}' 2>/dev/null || true
          docker exec portfolio_postgres postgres --version 2>/dev/null || true

      - name: Cleanup dangling images
        if: always()
        run: |
          docker image prune -f
