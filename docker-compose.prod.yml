version: '3.9'

networks:
  shared-infra-net:
    external: true
  portfolio_net:
    driver: bridge

volumes:
  postgres_data:

services:
  # ─── DATABASE & ADMIN ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    networks: [portfolio_net]
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: portfolio_pgadmin
    networks: [portfolio_net]
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@khoi.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-P@ssw0rd123!}
    ports: ["5050:80"]
    depends_on: [postgres]

  # ─── MICROSERVICES ─────────────────────────────────────────
  identity_api:
    image: ghcr.io/vykhoi/portfolio-identity-api:latest
    container_name: portfolio_identity_api
    networks: [portfolio_net]
    env_file: .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=IdentityDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET_KEY}
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy

  content_api:
    image: ghcr.io/vykhoi/portfolio-content-api:latest
    container_name: portfolio_content_api
    networks: [portfolio_net, shared-infra-net]
    env_file: .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ContentDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING:-redis-shared:6379}
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy

  contact_api:
    image: ghcr.io/vykhoi/portfolio-contact-api:latest
    container_name: portfolio_contact_api
    networks: [portfolio_net, shared-infra-net]
    env_file: .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ContactDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS:-kafka-shared:9092}
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy

  notification_worker:
    image: ghcr.io/vykhoi/portfolio-notification-worker:latest
    container_name: portfolio_notification_worker
    networks: [portfolio_net, shared-infra-net]
    env_file: .env
    environment:
      - ConnectionStrings__HangfireConnection=Host=postgres;Database=HangfireDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=${KAFKA_BOOTSTRAP_SERVERS:-kafka-shared:9092}
      - Mail__Host=smtp.gmail.com
      - Mail__Port=587
      - Mail__Username=dangvykhoi@gmail.com
      - Mail__Password=${MAIL_APP_PASSWORD}
      - Mail__From=dangvykhoi@gmail.com
      - Mail__ToEmail=dangvykhoi@gmail.com
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy

  ai_api:
    image: ghcr.io/vykhoi/portfolio-ai-api:latest
    container_name: portfolio_ai_api
    networks: [portfolio_net]
    env_file: .env
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=AIDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy

  gateway_api:
    image: ghcr.io/vykhoi/portfolio-gateway-api:latest
    container_name: portfolio_gateway_api
    networks: [portfolio_net]
    env_file: .env
    environment:
      - DOTNET_gcServer=0
    ports:
      - "5000:8080"
    depends_on:
      - identity_api
      - content_api
      - contact_api
      - notification_worker

  frontend:
    image: ghcr.io/vykhoi/portfolio-frontend:latest
    container_name: portfolio_frontend
    networks: [portfolio_net]
    ports:
      - "18122:80"
