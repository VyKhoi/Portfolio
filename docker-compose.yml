networks:
  portfolio_net:
    driver: bridge

volumes:
  postgres_data:
  ollama_models:
    external: true
  pgadmin_data:

# Rotate container logs so a request flood cannot fill the server's disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── 1. DATABASE ─────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine
    container_name: portfolio_postgres
    networks: [portfolio_net]
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Only reachable from the server itself (use an SSH tunnel from other machines)
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # ─── 2. LOCAL AI (ISOLATED IN INTERNAL DOCKER NETWORK) ────────
  # NO PORTS EXPOSED TO HOST TO PREVENT EXTERNAL SPAM / SCRAPING
  ollama:
    image: ollama/ollama:0.40.11
    container_name: portfolio_ollama
    networks: [portfolio_net]
    logging: *default-logging
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_FLASH_ATTENTION: 1
    volumes:
      - ollama_models:/root/.ollama
      - ./src/Portfolio.AI:/ai
    deploy:
      resources:
        limits:
          # Leave CPU for the other sites on this server; the deploy workflow sets half the cores
          cpus: '${OLLAMA_CPUS:-2}'
          memory: 5G

  # ─── 3. BACKEND (.NET 9 MODULAR MONOLITH) ───────────────────
  # No published port: only the frontend nginx (same Docker network) talks to it
  backend:
    image: portfolio_backend:latest
    build:
      context: .
      dockerfile: src/Portfolio.API/Dockerfile
    container_name: portfolio_backend
    networks: [portfolio_net]
    logging: *default-logging
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=portfolio_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__Model=sigma-cat
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MAIL_APP_PASSWORD=${MAIL_APP_PASSWORD}
      - DOTNET_gcServer=0
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M

  # ─── 4. FRONTEND (REACT 19 + VITE) ──────────────────────────
  frontend:
    image: portfolio_frontend:latest
    build:
      context: src/Web/frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    networks: [portfolio_net]
    logging: *default-logging
    ports:
      - "18122:80"
    depends_on:
      backend:
        condition: service_started

  # ─── 5. PGADMIN 4 (DATABASE WEB UI) ─────────────────────────
  # Off by default. Start on demand: `docker compose --profile tools up -d pgadmin`
  # then open it through an SSH tunnel: ssh -L 5050:localhost:5050 <server>
  pgadmin:
    image: dpage/pgadmin4:9
    container_name: portfolio_pgadmin
    profiles: [tools]
    networks: [portfolio_net]
    logging: *default-logging
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@khoi.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./scripts/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
