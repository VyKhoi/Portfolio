version: '3.9'

networks:
  portfolio_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:
  prometheus_data:
  seq_data:

services:
  # ─── INFRASTRUCTURE ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    networks: [portfolio_net]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: portfolio_pgadmin
    networks: [portfolio_net]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@khoi.dev
      PGADMIN_DEFAULT_PASSWORD: P@ssw0rd123!
    ports: ["5050:80"]
    depends_on: [postgres]

  redis:
    image: redis/redis-stack:latest
    container_name: portfolio_redis
    networks: [portfolio_net]
    ports: ["6379:6379", "8001:8001"]
    volumes: [redis_data:/data]

  kafka:
    image: apache/kafka:latest
    container_name: portfolio_kafka
    networks: [portfolio_net]
    ports: ["9092:9092"]
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1

  kafka_ui:
    image: provectuslabs/kafka-ui:latest
    container_name: portfolio_kafka_ui
    networks: [portfolio_net]
    ports: ["8080:8080"]
    environment:
      - KAFKA_CLUSTERS_0_NAME=portfolio
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on: [kafka]

  minio:
    image: minio/minio:latest
    container_name: portfolio_minio
    networks: [portfolio_net]
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes: [minio_data:/data]

  # ─── OBSERVABILITY ──────────────────────────────────────────
  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: portfolio_otel
    networks: [portfolio_net]
    volumes: [./monitoring/otel-collector.yaml:/etc/otelcol-contrib/config.yaml]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: portfolio_jaeger
    networks: [portfolio_net]
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:latest
    container_name: portfolio_prometheus
    networks: [portfolio_net]
    ports: ["9090:9090"]
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml, prometheus_data:/prometheus]

  grafana:
    image: grafana/grafana:latest
    container_name: portfolio_grafana
    networks: [portfolio_net]
    ports: ["3001:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}

  seq:
    image: datalust/seq:latest
    container_name: portfolio_seq
    networks: [portfolio_net]
    ports: ["5341:5341", "8082:80"]
    volumes: [seq_data:/data]
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${GRAFANA_PASSWORD}

  # ─── MICROSERVICES ─────────────────────────────────────────
  identity_api:
    build:
      context: .
      dockerfile: src/Services/Identity.Service/API/Identity.Service.API/Dockerfile
    container_name: portfolio_identity_api
    networks: [portfolio_net]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=IdentityDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  content_api:
    build:
      context: .
      dockerfile: src/Services/Content.Service/API/Content.Service.API/Dockerfile
    container_name: portfolio_content_api
    networks: [portfolio_net]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ContentDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  contact_api:
    build:
      context: .
      dockerfile: src/Services/Contact.Service/API/Contact.Service.API/Dockerfile
    container_name: portfolio_contact_api
    networks: [portfolio_net]
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ContactDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification_worker:
    build:
      context: .
      dockerfile: src/Workers/Notification.Worker/Notification.Worker/Dockerfile
    container_name: portfolio_notification_worker
    networks: [portfolio_net]
    environment:
      - ConnectionStrings__HangfireConnection=Host=postgres;Database=HangfireDb;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Kafka__BootstrapServers=kafka:9092
      - Mail__Host=smtp.gmail.com
      - Mail__Port=587
      - Mail__Username=dangvykhoi@gmail.com
      - Mail__Password=${MAIL_APP_PASSWORD}
      - Mail__From=dangvykhoi@gmail.com
      - Mail__ToEmail=dangvykhoi@gmail.com
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway_api:
    build:
      context: .
      dockerfile: src/Services/Gateway.API/Gateway.API/Dockerfile
    container_name: portfolio_gateway_api
    networks: [portfolio_net]
    ports:
      - "5000:8080"
    depends_on:
      - identity_api
      - content_api
      - contact_api
      - notification_worker

  frontend:
    build:
      context: src/Web/frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    networks: [portfolio_net]
    ports:
      - "18122:80"
